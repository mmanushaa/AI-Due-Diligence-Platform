[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "due-diligence-backend"
version = "0.1.0"
description = "AI-powered software due diligence platform - backend API and pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.20",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "crewai>=1.15",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "langfuse>=2.60,<3",
    "weasyprint>=62",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
markers = [
    "real_auth: use the real authentication dependencies instead of the conftest sign-in",
]
