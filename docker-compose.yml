services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-due_diligence}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-due_diligence}"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MAX_UPLOAD_SIZE_MB: "200"
      REPO_STORAGE_ROOT: /app/storage/repos
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-due_diligence}
      REDIS_URL: redis://redis:6379/0
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway:8080}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-change-me}
      LLM_PROVIDER_Model: ${LLM_PROVIDER_Model:-gpt-4o-mini}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-change-me}
      LLM_PROVIDER_BASE_URL: ${LLM_PROVIDER_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app:cached
      - repo_storage:/app/storage/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --reload --log-level info --reload-include '*.py' --reload-include '*.html' --reload-dir /app/backend --reload-dir /app/frontend

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MAX_UPLOAD_SIZE_MB: "200"
      REPO_STORAGE_ROOT: /app/storage/repos
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-due_diligence}
      REDIS_URL: redis://redis:6379/0
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway:8080}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-change-me}
      LLM_PROVIDER_Model: ${LLM_PROVIDER_Model:-gpt-4o-mini}
      LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-change-me}
      LLM_PROVIDER_BASE_URL: ${LLM_PROVIDER_BASE_URL:-}
    volumes:
      - .:/app:cached
      - repo_storage:/app/storage/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.jobs.celery_app.app worker --loglevel=info --without-gossip --without-mingle -E --pool=solo --max-tasks-per-child 50

  frontend:
    image: node:24-slim
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app:cached
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -c "cd frontend && if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

volumes:
  postgres_data:
  repo_storage:
  frontend_node_modules:
