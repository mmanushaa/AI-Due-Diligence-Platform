services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-due_diligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Enables the vector and pg_trgm extensions on first start only.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-due_diligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LLM gateway (step 2.5). Every model call goes through here: the backend only
  # names an alias, and the gateway maps it to a provider model, retries and
  # falls back (see docker/litellm/config.yaml). The provider key is read from
  # the environment, never from this file.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_UPSTREAM_DEFAULT_MODEL: ${LITELLM_UPSTREAM_DEFAULT_MODEL:-openai/gpt-4o-mini}
      LITELLM_UPSTREAM_FALLBACK_MODEL: ${LITELLM_UPSTREAM_FALLBACK_MODEL:-openai/gpt-4o}
    volumes:
      - ./docker/litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
    environment:
      # In-network addresses, derived from the same .env values as the postgres service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-due_diligence}
      REDIS_URL: redis://redis:6379/0
      # The gateway's in-network address, not the host-side LITELLM_BASE_URL.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_TRIAGE_MODEL: ${LLM_TRIAGE_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started

  # Celery worker (step 1.9). Runs the audit pipeline: intake validation, file
  # filtering and the scanners. Scanner containers are started through the host
  # daemon, so the repository snapshots must be visible to the daemon at the same
  # path the worker passes to it; see the README before relying on this service.
  worker:
    build:
      context: ./backend
      target: worker
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "audits"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-due_diligence}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /srv/data/uploads
      # Agent calls go through the gateway, as in the api service.
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local-dev}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-gpt-4o-mini}
      LLM_TRIAGE_MODEL: ${LLM_TRIAGE_MODEL:-gpt-4o-mini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gpt-4o}
    volumes:
      - ./data:/srv/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started

  # Minimal UI (step 1.10). Vite dev server for local walkthroughs; it proxies
  # /api to the api service (see frontend/vite.config.ts).
  frontend:
    image: node:24-slim
    working_dir: /srv/frontend
    volumes:
      - ./frontend:/srv/frontend
    environment:
      VITE_API_TARGET: http://api:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
